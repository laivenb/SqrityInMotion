<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQrity | Home</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/home.css">
</head>

<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div id="sidebar-container">
            <!-- Sidebar content will be injected here dynamically -->
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="header">
                <div class="scan-info">
                    <h1>Latest Scan</h1>
                 <!--   <button id="pentestButton" class="btn btn-primary" style="display: none;">Pentest</button> -->
                    <span class="ip-address">192.168.5.110</span>
                </div>
            </div>

            <div class="alerts-section">
                <div class="doughnutContainer">
                    <!-- Doughnut Chart -->
                    <canvas id="doughnutChart" width="170" height="170"></canvas>
                </div>
                <div class="alert-levels">
                    <!-- Progress Chart -->
                    <canvas id="progressChart" height="170"></canvas>
                </div>
            </div>


            <br>
            <div class="d-flex justify-content-between align-items-center">
                <div class="score-legend d-flex align-items-center">
                    <div class="legend-item d-flex align-items-center mr-3">
                        <span class="color-box low"></span>
                        <span class="ml-2">Low (0.0 – 3.9)</span>
                    </div>
                    <div class="legend-item d-flex align-items-center mr-3">
                        <span class="color-box medium"></span>
                        <span class="ml-2">Medium (4.0 – 6.9)</span>
                    </div>
                    <div class="legend-item d-flex align-items-center mr-3">
                        <span class="color-box high"></span>
                        <span class="ml-2">High (7.0 – 8.9)</span>
                    </div>
                    <div class="legend-item d-flex align-items-center">
                        <span class="color-box critical"></span>
                        <span class="ml-2">Critical (9.0 – 10.0)</span>
                    </div>
                </div>
                <a href="cvereport-details.html" id="saveCveReportBtn" class="btn btn-primary">Save CVE Report</a>
            </div>


            <div class="table-wrapper">
                <table id="portTable" class="table table-striped table-bordered port-table">
                    <thead>
                    <tr>
                        <th>Port</th>
                        <th>State</th>
                        <th>Service</th>
                        <th>CVE ID</th>
                        <th>CVE Score <i class="fas fa-sort"></i></th>
                    </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap4.min.js"></script>


<script src="js/home.js"></script>
<script src="js/sidebar.js"></script>

</body>

</html>
