<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQrity | Register</title>
    <link rel="stylesheet" href="css/register.css">
</head>

<body>
<div class="register-container">
    <!-- <img src="logo.png" alt="Logo"> -->

    <div class="column1">
        <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" placeholder="First Name" required>
        </div>

        <div class="form-group">
            <label for="middleName">Middle Name</label>
            <input type="text" id="middleName" placeholder="Middle Name" required>
        </div>

        <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" placeholder="Last Name" required>
        </div>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Username" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Email" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Password" required>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
        </div>
    </div>

    <div class="column2">
        <div class="form-group">
            <label for="contactNumber">Contact Number</label>
            <input type="text" id="contactNumber" placeholder="Contact Number" required>
        </div>

        <div class="form-group">
            <label for="company">Company</label>
            <input type="text" id="company" placeholder="Company" required>
        </div>

        <div class="form-group">
            <label for="department">Department</label>
            <input type="text" id="department" placeholder="Department" required>
        </div>

        <div class="form-group">
            <label for="position">Position</label>
            <select id="position" required>
                <option value="" disabled selected>Select your position</option>
                <option value="vulnerabilityAnalyst">Vulnerability Analyst & Penetration Tester</option>
                <option value="supervisor">Supervisor</option>
                <!-- Add other positions if necessary -->
            </select>
        </div>

        <div class="form-group">
            <label for="birthday">Birthday</label>
            <input type="date" id="birthday" placeholder="Birthday" required>
        </div>
    </div>

    <button id="registerButton">Register</button>
    <p>Already have an account? <a href="login.html">Login here</a></p>
</div>

<!-- Link to the external JavaScript file -->
<script type="module" src="js/register.js"></script>
</body>

</html>
