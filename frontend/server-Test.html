<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Web-based Metasploit Terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css">
  <style>
    #terminal {
      width: 100%;
      height: 700px;
      background-color: #1e1e1e;
      overflow-y: auto;
    }
  </style>
</head>
<body>

<h2>Metasploit Terminal</h2>
<div id="terminal"></div>

<button id="attackButton">Run Metasploit</button>

<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.min.js"></script>
<script>
  const terminal = new Terminal();
  terminal.open(document.getElementById('terminal'));

  const socket = io.connect('http://192.168.254.127:5001/terminal');

  let currentInput = "";
  let isSearching = false;

  socket.on('output', (data) => {
    if (data.output) {
      console.log("Received output:", data.output);
      const outputLines = data.output.split('\n');
      outputLines.forEach((line) => {
        terminal.write(line + '\r\n');
      });

      if (data.type === 'search') {
        terminal.write("Search completed.\r\n");
        isSearching = false;
      }

      if (data.type === 'initial') {
        terminal.write("Initial output received.\r\n");
      }
    }
  });

  terminal.onData((input) => {
    if (input === '\u001b[3~') {
      terminal.write('\b \b');
      return;
    }

    if (input.charCodeAt(0) === 13) {
      console.log("User input:", currentInput);
      socket.emit('input', { 'command': currentInput });
      terminal.write('\r\n');
      currentInput = "";
    } else {
      currentInput += input;
      terminal.write(input);
    }
  });

  document.getElementById('attackButton').addEventListener('click', (event) => {
    event.preventDefault();
    socket.emit('start_console');
  });

  terminal.write("Welcome to the Metasploit Terminal!\r\n");
</script>

</body>
</html>
