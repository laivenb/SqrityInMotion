<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQrity | Admin Home</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/adminHome.css">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div id="sidebar-container">
            <!-- Sidebar content will be injected here dynamically -->
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header with Title and Date -->
            <div class="header d-flex justify-content-between align-items-center">
                <h2 class="dashboard-title">Admin Dashboard</h2>
            </div>

            <!-- Dashboard Cards Section -->
            <div class="dashboard-grid">
                <!-- Total Users Card -->
                <div class="dashboard-card card-users">
                    <i class="fas fa-users card-icon"></i>
                    <h3>Total Users</h3>
                    <p class="dashboard-stat" id="total-users">1,234</p>
                    <p>Registered Users</p>
                </div>

                <!-- Total Requests Card -->
                <div class="dashboard-card card-requests">
                    <i class="fas fa-user-check card-icon"></i>
                    <h3>Total Requests</h3>
                    <p class="dashboard-stat" id="total-requests">56</p>
                    <p>Pending User Requests</p>
                </div>
            </div>

            <!-- Charts Section -->
            <div class="dashboard-charts">
                <canvas id="downloadsChart" width="400" height="200"></canvas>
                <canvas id="storageChart" width="400" height="200"></canvas>
                <!--<canvas id="doughnutChart" width="400" height="200"></canvas>
                <canvas id="progressChart" width="400" height="200"></canvas>-->
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-database.js"></script>

<script src="js/adminHome.js"></script>
<script src="js/adminSidebar.js"></script>
<script src="js/app.js"></script>
</body>
</html>
