<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQrity | View Reports</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/viewreports.css">
</head>

<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div id="sidebar-container">
            <!-- Sidebar content will be injected here dynamically -->
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="user-records">
                <h2>View Reports</h2>
                <table id="reportsTable" class="table table-striped table-bordered">
                    <thead>
                    <tr>
                        <th>ReportID</th>
                        <th>Report Name</th>
                        <th>Date Created</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Sample Data -->
                    <tr>
                        <td>101</td>
                        <td>Network Vulnerability Report</td>
                        <td>2023-05-10</td>
                        <td><button class="btn btn-primary btn-sm export-btn">Export as JSON</button></td>
                    </tr>
                    <tr>
                        <td>102</td>
                        <td>Device Security Analysis</td>
                        <td>2023-05-12</td>
                        <td><button class="btn btn-primary btn-sm export-btn">Export as JSON</button></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>


<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap4.min.js"></script>
<script src="js/sidebar.js"></script>

<script>
    $(document).ready(function () {
        // Initialize DataTable
        $('#reportsTable').DataTable({
            "pageLength": 10,
            "lengthMenu": [5, 10, 25, 50],
            "ordering": true,
            "searching": true,
            "responsive": true,
        });


    });
</script>
</body>

</html>
