<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQrity | View Reports</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/viewreports.css">
</head>

<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div id="sidebar-container">
            <!-- Sidebar content will be injected here dynamically -->
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="user-records">
                <h2>Port Reports</h2>
                <table id="reportsTable" class="table table-striped table-bordered">
                    <thead>
                    <tr>
                        <th>ReportID</th>
                        <th>Report Name</th>
                        <th>Date Created</th>
                        <th>Generated By</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td>020010_p2zxj433lxr</td>
                        <td>Test Port Scan Report for 192.168.1.16</td>
                        <td>11/9/2024, 8:00:00 AM</td>
                        <td>Austin</td>
                        <td class="button-container">
                            <button class="btn view-btn bg-green-500 hover:bg-green-600 text-white">View Report</button>
                            <button class="btn export-btn bg-blue-500 hover:bg-blue-600 text-white">Export as JSON</button>
                            <button class="btn send-btn bg-yellow-500 hover:bg-yellow-600 text-black">Send to Supervisor</button>
                        </td>

                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>


<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap4.min.js"></script>
<script src="js/sidebar.js"></script>
<script type="module" src="js/portreport.js"></script>
</body>

</html>
