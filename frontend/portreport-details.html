<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQrity | Port Report Details</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/viewreports.css">
</head>

<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div id="sidebar-container">
            <!-- Sidebar content will be injected here dynamically -->
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Back Button -->
            <button onclick="goBack()" class="btn btn-secondary mb-3">
                <i class="fas fa-arrow-left"></i> Back to Port Reports
            </button>

            <!-- Dynamic Header for Report Title and Date Created -->
            <div class="d-flex justify-content-between align-items-center report-header">
                <h2 id="reportTitle" class="font-weight-bold mb-0">Report Details</h2>
                <p id="reportDate" class="text-muted mb-0"></p>
            </div>

            <hr>

            <!-- Port Details Table -->
            <div class="port-details">
                <table id="portDetailsTable" class="table table-striped table-bordered mt-3">
                    <thead>
                    <tr>
                        <th>Port</th>
                        <th>State</th>
                        <th>Service</th>
                        <th>Version</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Sample data row -->
                    <tr>
                        <td>21/tcp</td>
                        <td>open</td>
                        <td>ftp</td>
                        <td>vsftpd 3.0.3</td>
                    </tr>
                    <tr>
                        <td>22/tcp</td>
                        <td>open</td>
                        <td>ssh</td>
                        <td>OpenSSH 7.4p1</td>
                    </tr>
                    <tr>
                        <td>80/tcp</td>
                        <td>open</td>
                        <td>http</td>
                        <td>Apache httpd 2.4.46</td>
                    </tr>
                    <!-- More rows as needed -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="js/sidebar.js"></script>

<script>
    // Sample report data
    const reportsData = {
        "101": {
            "title": "Network Vulnerability Report",
            "dateCreated": "2023-05-10"
        },
        "102": {
            "title": "Device Security Analysis",
            "dateCreated": "2023-05-12"
        }
        // Add more report data here as needed
    };

    // Function to retrieve query parameters from the URL
    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    // Set the report title and date based on the reportID
    document.addEventListener('DOMContentLoaded', () => {
        const reportID = getQueryParam('reportID');
        if (reportID && reportsData[reportID]) {
            document.getElementById('reportTitle').textContent = reportsData[reportID].title;
            document.getElementById('reportDate').textContent = `Date Created: ${reportsData[reportID].dateCreated}`;
        } else {
            document.getElementById('reportTitle').textContent = "Report Not Found";
            document.getElementById('reportDate').textContent = "";
        }
    });

    // Back button function
    function goBack() {
        window.location.href = 'port-reports.html';
    }
</script>
</body>
</html>
