<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Information</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/userinfo.css">
  <link rel="stylesheet" href="css/sidebar.css">
</head>
<body>

<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <div id="sidebar-container" class="col-md-2">
      <!-- Sidebar content will be injected here dynamically -->
    </div>

    <!-- Main Content -->
    <div class="col-md-10 main-content">
      <h1 class="header">User Information</h1>

      <!-- Profile Details Section (removed profile placeholder) -->
      <div class="ml-4">
        <div class="personal-info">
          <div class="user-info-row">
            <div class="form-group">
              <label for="last-name">Last Name</label>
              <input type="text" id="last-name" value="" readonly>
            </div>
            <div class="form-group">
              <label for="contact-number">
                Contact Number
                <i class="fas fa-edit" title="Edit Contact Number" style="cursor: pointer; color: #007bff;"></i>
              </label>
              <input type="text" id="contact-number" value=""> <!-- Made editable -->
            </div>
          </div>
          <div class="user-info-row">
            <div class="form-group">
              <label for="first-name">First Name</label>
              <input type="text" id="first-name" value="" readonly>
            </div>
            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" value="" readonly>
            </div>
          </div>
          <div class="user-info-row">
            <div class="form-group">
              <label for="user-name">Username</label>
              <input type="text" id="user-name" value="" readonly>
              <button class="btn btn-primary btn-sm mt-3">Save</button> <!-- Adjusted margin -->
            </div>
          </div>
        </div>
      </div>


</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="js/sidebar.js"></script>

<script type="module" src="js/userinfo.js"></script>

</body>
</html>
