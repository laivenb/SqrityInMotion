<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Information</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/userinfo.css">
  <link rel="stylesheet" href="css/sidebar.css">
</head>
<body>

<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <div id="sidebar-container" class="col-md-2">
      <!-- Sidebar content will be injected here dynamically -->
    </div>

    <!-- Main Content -->
    <div class="col-md-10 main-content">
      <h1 class="header">User Information</h1>

      <!-- Profile Picture Section -->
      <div class="user-info">
        <div class="profile-section">
          <div class="profile-picture">
            <img src="placeholder.png" alt="Profile Picture" width="150" height="150">
            <label for="profile-upload" class="upload-icon">📷</label>
            <input type="file" id="profile-upload" hidden />
          </div>
        </div>

        <!-- User Details Section -->
        <div class="personal-info">
          <div class="form-group">
            <label for="last-name">Last Name</label>
            <input type="text" id="last-name" value="Doe" readonly>
          </div>
          <div class="form-group">
            <label for="first-name">First Name</label>
            <input type="text" id="first-name" value="John" readonly>
          </div>
          <div class="form-group">
            <label for="middle-name">Middle Name</label>
            <input type="text" id="middle-name" value="A." readonly>
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" value="johndoe@sqrity.com" readonly>
          </div>
          <div class="form-group">
            <label for="contact-number">Contact Number</label>
            <input type="text" id="contact-number" value="09123456789" readonly>
          </div>
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" value="john_doe" readonly>
          </div>
        </div>
      </div>

      <hr class="divider">

      <!-- Department Information Section -->
      <div class="department-info">
        <h2>Department Information</h2>
        <div class="form-group">
          <label for="department">Department</label>
          <input type="text" id="department" value="Engineering" readonly>
        </div>
        <div class="form-group">
          <label for="department-head">Department Head</label>
          <input type="text" id="department-head" value="Jane Smith" readonly>
        </div>
        <div class="form-group">
          <label for="role">Role</label>
          <input type="text" id="role" value="Software Developer" readonly>
        </div>
        <div class="form-group">
          <label for="email-duplicate">Email Address</label>
          <input type="email" id="email-duplicate" value="johndoe@sqrity.com" readonly>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="js/userinfo.js"></script>
<script src="js/sidebar.js"></script>

</body>
</html>
