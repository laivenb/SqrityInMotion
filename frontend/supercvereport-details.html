<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQrity | CVE Report Details</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/viewreports.css">
</head>

<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div id="sidebar-container">
            <!-- Sidebar content will be injected here dynamically -->
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Back Button -->
            <!-- Dynamic Header for Report Title and Date Created -->
            <div class="d-flex justify-content-between align-items-center report-header">
                <h2 id="reportName" class="font-weight-bold mb-0">Report Details</h2>
                <p id="dateCreated" class="text-muted mb-0"></p>
                <p id="createdBy" class="text-muted mb-0"></p>

            </div>


            <hr class="my-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <button id="backButton" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Back to Port Reports
                </button>
                <button id="exportPDFBtn" class="btn btn-primary">
                    <i class="fas fa-file-pdf"></i> Export to PDF
                </button>
            </div>

            <div class="report-summary my-3 d-flex justify-content-between align-items-center">
                <!-- Legend (Left) -->
                <div class="score-legend d-flex align-items-center">
                    <div class="legend-item d-flex align-items-center mr-3">
                        <span class="color-box low"></span>
                        <span class="ml-2">Low (0.0 – 3.9)</span>
                    </div>
                    <div class="legend-item d-flex align-items-center mr-3">
                        <span class="color-box medium"></span>
                        <span class="ml-2">Medium (4.0 – 6.9)</span>
                    </div>
                    <div class="legend-item d-flex align-items-center mr-3">
                        <span class="color-box high"></span>
                        <span class="ml-2">High (7.0 – 8.9)</span>
                    </div>
                    <div class="legend-item d-flex align-items-center">
                        <span class="color-box critical"></span>
                        <span class="ml-2">Critical (9.0 – 10.0)</span>
                    </div>
                </div>

                <!-- Port Counts (Right) -->
                <div class="d-flex align-items-center">
    <span class="p-1 text-white"
          style="background-color: #348ae6; font-size: 1rem; font-weight: bold; border-radius: 3px;">
      Open Ports: <span id="openPortsCount">0</span>
    </span>
                    <span class="p-1 text-white ml-3"
                          style="background-color: #e33737; font-size: 1rem; font-weight: bold; border-radius: 3px;">
      Critical Ports: <span id="criticalPortsCount">0</span>
    </span>
                </div>

            </div>


            <!-- CVE Details Table -->
            <div class="cve-details">
                <table id="cveDetailsTable" class="table table-striped table-bordered mt-3">
                    <thead>
                    <tr>
                        <th>Port</th>
                        <th>State</th>
                        <th>Service</th>
                        <th>CVE ID</th>
                        <th>CVE Score</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Sample data row -->
                    <tr>
                        <td>21/tcp</td>
                        <td>open</td>
                        <td>ftp</td>
                        <td>CVE-2021-1234</td>
                        <td>7.5</td>
                    </tr>
                    <tr>
                        <td>22/tcp</td>
                        <td>open</td>
                        <td>ssh</td>
                        <td>CVE-2020-5678</td>
                        <td>8.2</td>
                    </tr>
                    <tr>
                        <td>80/tcp</td>
                        <td>open</td>
                        <td>http</td>
                        <td>CVE-2019-9101</td>
                        <td>9.1</td>
                    </tr>
                    <!-- More rows as needed -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="js/superSide.js"></script>
<script type="module" src="js/supercvereport-details.js"></script>
</body>
</html>
