<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Port Specific Information</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/home.css">
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <div id="sidebar-container">
      <!-- Sidebar content will be injected here dynamically -->
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="header">
        <div class="scan-info">
          <h1>Latest Scan</h1>
          <span class="ip-address">192.168.5.110</span>

          <h1>Port Details</h1>

          <!-- Table for displaying port information -->
          <table id="portDetailsTable" class="display" style="width:100%">
            <tbody>
            <!-- Data will be populated by JavaScript -->
            </tbody>
          </table>

        </div>
      </div>

      <div id="portDetails"></div>

        <h2>SearchSploit</h2>
        <div class="searchContainer">
          <button id="searchSploitButton">Search in SearchSploit</button>
          <div id="searchSploitResults"></div>
        </div>

        <h2>Metasploit</h2>
        <div class="msfContainer">
          <button id="msfSearchButton">Search in Metasploit</button>
          <div id="msfSearchResults"></div>
          <button id="attackPortButton" style="display: none;">Attack Port</button>

          <h2>Hydra</h2>
          <div class="hydraContainer">
            <button id="hydraButton">Try Default Credentials</button>
            <div id="hydraResults"></div>
          </div>

          <h2>Medusa</h2>
          <div class="medusaContainer">
            <button id="medusaButton">Try Default Credentials</button>
            <div id="medusaResults"></div>
          </div>

          <h2>NFS Mounting</h2>
          <div class="nsfContainer">
            <button id="nsfButton">Try Default Credentials</button>
            <div id="nsfResults"></div>
          </div>
      </div>

    </div>

  </div>
</div>


<!-- DataTables and jQuery libraries -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>

<!-- Link to external JavaScript file -->
<script src="js/port-specific.js"></script>
<script src="js/sidebar.js"></script>
</body>
</html>
