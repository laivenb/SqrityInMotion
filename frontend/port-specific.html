<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Port Specific Information</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">

  <!-- Custom CSS Files -->
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/port-specific.css">
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <div id="sidebar-container">
      <!-- Sidebar content will be injected here dynamically -->
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="header">
        <div class="scan-info">
          <h1>Latest Scan</h1>
          <span class="ip-address">192.168.5.110</span>

          <h2 class="section-title">Port Details</h2>
          <!-- Table for displaying port information -->
          <div class="table-wrapper">
            <table id="portDetailsTable" class="table table-striped">
              <thead>
              <tr>
                <th>Port</th>
                <th>State</th>
                <th>Service</th>
                <th>Version</th>
              </tr>
              </thead>
              <tbody id="portDetails">
              </tbody>
            </table>
          </div>
        </div>
      </div>



      <!-- Tool Sections -->
      <div class="tool-sections">

        <div class="tool-container">
          <h2>SearchSploit</h2>
          <button id="searchSploitButton" class="btn btn-primary mb-3">Search in SearchSploit</button>
          <div id="searchSploitResults" class="search-results"></div>
        </div>

        <div class="tool-container">
          <h2>Metasploit</h2>
          <button id="metasploitButton" class="btn btn-primary mb-3">Search in Metasploit</button>
          <div id="metasploitResults" class="search-results"></div>
        </div>


        <div class="tool-container">
          <h2>Hydra</h2>
          <button id="hydraButton" class="btn btn-primary mb-3">Try Default Credentials</button>
        </div>

        <div class="tool-container">
          <h2>Medusa</h2>
          <button id="medusaButton" class="btn btn-primary mb-3">Try Default Credentials</button>
        </div>

        <div class="tool-container">
          <h2>NFS Mounting</h2>
          <button id="nsfButton" class="btn btn-primary mb-3">Try Default Credentials</button>
        </div>

      </div>

    </div>
  </div>
</div>

<!-- DataTables and jQuery libraries -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>

<!-- Link to external JavaScript file -->
<script src="js/port-specific.js"></script>
<script src="js/sidebar.js"></script>
<script type="module" src="port-specific.js"></script>

</body>
</html>
